<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="content_title">导航图谱</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="d3.v7.min.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="graph-toolbar">
      <div class="graph-date-control">
        <button id="graph-date-toggle" class="graph-button" type="button" aria-controls="graph-calendar" aria-expanded="false">
          <img src="../../images/logo-48.png" width="18" height="18" alt="">
          <span id="graph-date-value" data-i18n="content_session_date">日期</span>
          <span class="graph-date-chevron" aria-hidden="true"></span>
        </button>
        <div id="graph-calendar" class="graph-calendar" hidden>
          <div id="calendar-session-selector" class="calendar-session-selector"></div>
          <div class="graph-calendar-footer">
            <span id="graph-duration"></span>
            <button id="graph-today" class="graph-button" type="button" data-i18n="graph_toolbar_today" hidden>今天</button>
          </div>
        </div>
      </div>
      <div id="view-switcher-container" class="graph-view-switcher" role="group">
        <button id="tree-view" class="graph-button" type="button" aria-pressed="false" data-i18n="content_tree_view">树形图</button>
        <button id="waterfall-view" class="graph-button" type="button" aria-pressed="true" data-i18n="content_waterfall_view">瀑布图</button>
        <a id="ocean-view" class="graph-button" href="../ocean/index.html" data-i18n="ocean_view">海图</a>
      </div>
      <div class="graph-summary">
        <span id="graph-record-count"></span>
        <button id="graph-show-hidden" class="graph-button" type="button" data-i18n="content_hidden" disabled>已隐藏</button>
      </div>
      <button id="graph-filter-toggle" class="graph-button" type="button" aria-controls="control-panel" aria-expanded="false" data-i18n="graph_toolbar_filter">筛选</button>
    </header>

    <!-- 主体内容区域 -->
    <div class="main-container">
      <!-- 中间可视化区域 -->
      <div class="visualization-container" id="visualization-container">
        <!-- 这里会渲染SVG -->
      </div>

      <div id="tree-fold-actions" hidden>
        <div class="tree-fold-buttons">
          <button id="tree-collapse-all" class="graph-button" type="button" aria-disabled="true" data-i18n="tree_day_collapse_all">全部折叠</button>
          <button id="tree-expand-all" class="graph-button" type="button" aria-disabled="true" data-i18n="tree_day_expand_all">全部展开</button>
        </div>
        <p id="tree-fold-limit" data-i18n="tree_day_expand_all_limit" hidden>节点太多，请用图上的 +N 逐组展开。</p>
        <p id="tree-range-limit" class="graph-range-limit" hidden></p>
      </div>
      <div id="tree-viewport-tools" hidden>
        <span id="tree-zoom-value">100%</span>
        <button id="tree-fit-to-view" class="graph-button" type="button" data-i18n="graph_toolbar_fit_tree" disabled>适配全图</button>
      </div>
      <div id="waterfall-toolbar" hidden>
        <div class="waterfall-range">
          <span id="waterfall-observation-range" aria-live="polite"></span>
          <p id="waterfall-range-limit" class="graph-range-limit" hidden></p>
        </div>
        <button id="waterfall-fit-toggle" class="graph-button" type="button" data-i18n="content_waterfall_fit_view">显示全图</button>
      </div>

      <aside class="control-panel" id="control-panel" aria-labelledby="graph-filter-heading" hidden>
        <div id="filter-panel-container" class="filters-panel">
          <h2 id="graph-filter-heading" data-i18n="content_filters">筛选器</h2>
          
          <div class="filter-section">
            <h3 data-i18n="content_navigation_type">导航类型</h3>
            <div class="filter-option">
              <input type="checkbox" id="type-link" checked>
              <label for="type-link" data-i18n="content_link_click">链接点击</label>
            </div>
            <div class="filter-option">
              <input type="checkbox" id="type-address" checked>
              <label for="type-address" data-i18n="content_address_bar">地址栏</label>
            </div>
            <div class="filter-option">
              <input type="checkbox" id="type-form" checked>
              <label for="type-form" data-i18n="content_form_submit">表单提交</label>
            </div>
            <div class="filter-option">
              <input type="checkbox" id="type-js" checked>
              <label for="type-js" data-i18n="content_js_redirect">JavaScript/重定向</label>
            </div>
          </div>
          
          <div class="filter-section">
            <h3 data-i18n="content_navigation_behavior">导航行为</h3>
            <div class="filter-option">
              <input type="checkbox" id="filter-reload" checked>
              <label for="filter-reload" data-i18n="content_show_reload">显示页面重载</label>
            </div>
            <div class="filter-option">
              <input type="checkbox" id="filter-history" checked>
              <label for="filter-history" data-i18n="content_show_history">显示历史导航</label>
            </div>
          </div>
          
          <div class="filter-section">
            <h3 data-i18n="content_page_status">页面状态</h3>
            <div class="filter-option">
              <input type="checkbox" id="filter-closed">
              <label for="filter-closed" data-i18n="content_show_closed">显示已关闭页面</label>
            </div>
            <div class="filter-option">
              <input type="checkbox" id="filter-tracking">
              <label for="filter-tracking" data-i18n="content_show_tracking">显示跟踪页面</label>
            </div>
          </div>
        </div>
      </aside>

      <!-- 右侧详情面板 -->
      <div class="details-panel">
        <div id="node-details"><!-- 节点详情会显示在这里 --></div>
      </div>
    </div>

    <!-- 其余UI组件保持不变 -->
    <!-- 加载和错误提示 -->
    <div id="loading" style="display: none;">
      <div class="spinner"></div>
      <p data-i18n="content_loading">正在加载数据...</p>
    </div>
    
    <!-- 错误UI组件 - 默认隐藏 -->
    <div id="navigraph-error" class="error-container" style="display: none;">
      <div class="error-header">
        <h3 class="error-title" data-i18n="content_error">错误</h3>
        <button class="close-button" data-recovery="dismiss">&times;</button>
      </div>
      <p class="error-message"></p>
      <div class="error-actions">
        <button class="refresh-button" data-recovery="reload" data-i18n="content_refresh_page">刷新页面</button>
        <button class="dismiss-button" data-recovery="dismiss" data-i18n="content_close">关闭</button>
      </div>
    </div>
    
    <!-- 详细错误UI组件 - 默认隐藏 -->
    <div id="navigraph-error-detailed" class="error-container detailed" style="display: none;">
      <div class="error-header">
        <h3 class="error-title"></h3>
        <button class="close-button" data-recovery="dismiss">&times;</button>
      </div>
      <p class="error-message"></p>
      <details>
        <summary data-i18n="content_tech_details">技术细节</summary>
        <pre class="error-stack"></pre>
      </details>
      <div class="error-actions">
        <button class="refresh-button" data-recovery="reload" data-i18n="content_refresh_page">刷新页面</button>
        <button class="dismiss-button" data-recovery="dismiss" data-i18n="content_close">关闭</button>
      </div>
    </div>
    
    <!-- 通知消息组件 - 默认隐藏 -->
    <div id="navigraph-toast" class="toast-message" style="display: none;"></div>
    
  </div>
  
  <!-- 工具提示 -->
  <div id="tooltip" class="tooltip"></div>
  
  <!-- 脚本 -->
  <script type="module" src="content.js"></script>
</body>
</html>
